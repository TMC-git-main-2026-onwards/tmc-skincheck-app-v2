<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a2332">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>The Mole Clinic — Skin Safety</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet">
<style>
:root{
  --tmc-navy:#1a2332;--tmc-navy-light:#243044;--tmc-teal:#2ec4b6;--tmc-teal-dark:#20a99c;
  --tmc-teal-light:#e8faf8;--tmc-coral:#e07a5f;--tmc-coral-light:#fdf0ec;
  --tmc-gold:#f2cc8f;--tmc-cream:#faf8f5;--tmc-white:#ffffff;
  --tmc-gray-100:#f5f5f5;--tmc-gray-200:#e8e8e8;--tmc-gray-300:#d1d1d1;
  --tmc-gray-400:#9a9a9a;--tmc-gray-600:#666666;--tmc-gray-800:#333333;
  --font-display:'Fraunces',Georgia,serif;--font-body:'DM Sans',-apple-system,sans-serif;
  --radius-sm:8px;--radius-md:12px;--radius-lg:20px;--radius-xl:28px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08);--shadow-md:0 4px 16px rgba(0,0,0,.1);
  --shadow-lg:0 8px 32px rgba(0,0,0,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:var(--font-body);background:var(--tmc-cream);color:var(--tmc-gray-800);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body{padding-bottom:env(safe-area-inset-bottom)}
#app{min-height:100vh;overflow:hidden}
@keyframes fadeInUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideInRight{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes pulseCTA{0%,100%{box-shadow:0 0 0 0 rgba(46,196,182,.5)}50%{box-shadow:0 0 0 10px rgba(46,196,182,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scanLine{0%{transform:translateY(0);opacity:1}90%{opacity:1}100%{transform:translateY(180px);opacity:0}}
@keyframes bodyPulse{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes nudgeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes collapseOpen{from{max-height:0;opacity:0}to{max-height:2000px;opacity:1}}
.animate-in{animation:fadeInUp .5s ease-out forwards}
.animate-in-delay-1{animation:fadeInUp .5s ease-out .1s forwards;opacity:0}
.animate-in-delay-2{animation:fadeInUp .5s ease-out .2s forwards;opacity:0}
.animate-in-delay-3{animation:fadeInUp .5s ease-out .3s forwards;opacity:0}
.animate-in-delay-4{animation:fadeInUp .5s ease-out .4s forwards;opacity:0}
.screen-slide-right{animation:slideInRight .35s cubic-bezier(.4,0,.2,1) forwards}
.screen-slide-left{animation:slideInLeft .35s cubic-bezier(.4,0,.2,1) forwards}
.screen{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px;background:var(--tmc-white);border-bottom:1px solid var(--tmc-gray-200);position:sticky;top:0;z-index:100}
.header-logo{font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--tmc-navy);letter-spacing:-.3px}
.header-logo span{color:var(--tmc-teal)}
.header-back{width:44px;height:44px;border-radius:50%;border:none;background:var(--tmc-gray-100);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:18px;color:var(--tmc-gray-600)}
.header-back:hover{background:var(--tmc-gray-200)}
.progress-bar{height:3px;background:var(--tmc-gray-200)}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--tmc-teal),var(--tmc-teal-dark));transition:width .6s cubic-bezier(.4,0,.2,1);border-radius:0 2px 2px 0}
.progress-label{font-size:12px;color:var(--tmc-gray-400);text-align:center;padding:6px 20px 0;font-weight:500;letter-spacing:.5px;text-transform:uppercase}
.progress-microcopy{font-size:12px;color:var(--tmc-teal-dark);text-align:center;padding:3px 20px 6px;font-weight:500;font-style:italic}
.content{flex:1;padding:24px 20px 100px;overflow-y:auto}
.content-tight{padding:16px 20px 100px}
.title-xl{font-family:var(--font-display);font-size:32px;font-weight:600;color:var(--tmc-navy);line-height:1.2;letter-spacing:-.5px}
.title-lg{font-family:var(--font-display);font-size:26px;font-weight:600;color:var(--tmc-navy);line-height:1.25;letter-spacing:-.3px}
.title-md{font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--tmc-navy);line-height:1.3}
.subtitle{font-size:16px;color:var(--tmc-gray-600);line-height:1.6;margin-top:12px}
.subtitle-sm{font-size:14px;color:var(--tmc-gray-600);line-height:1.5;margin-top:8px}
.label{font-size:13px;font-weight:600;color:var(--tmc-gray-400);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.btn-primary{width:100%;padding:16px 24px;background:var(--tmc-teal);color:white;font-family:var(--font-body);font-size:16px;font-weight:600;border:none;border-radius:var(--radius-md);cursor:pointer;transition:all .25s;letter-spacing:.2px}
.btn-primary:hover{background:var(--tmc-teal-dark);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn-secondary{width:100%;padding:14px 24px;background:transparent;color:var(--tmc-teal);font-family:var(--font-body);font-size:15px;font-weight:600;border:2px solid var(--tmc-teal);border-radius:var(--radius-md);cursor:pointer;transition:all .25s}
.btn-secondary:hover{background:var(--tmc-teal-light)}
.btn-ghost{background:none;border:none;color:var(--tmc-teal);font-family:var(--font-body);font-size:14px;font-weight:600;cursor:pointer;padding:8px 0;transition:opacity .2s}
.btn-ghost:hover{opacity:.7}
.bottom-action{position:fixed;bottom:0;left:0;right:0;padding:16px 20px;padding-bottom:calc(16px + env(safe-area-inset-bottom));background:linear-gradient(0deg,var(--tmc-cream) 70%,transparent);z-index:90}
.bottom-action .btn-primary{max-width:480px;margin:0 auto;display:block}
.card{background:var(--tmc-white);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-sm);border:1px solid var(--tmc-gray-200)}
.card-highlight{background:var(--tmc-white);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-md);border:2px solid var(--tmc-teal)}
.option-card{background:var(--tmc-white);border:2px solid var(--tmc-gray-200);border-radius:var(--radius-md);padding:16px 20px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:14px;margin-bottom:10px}
.option-card:hover,.option-card.selected{border-color:var(--tmc-teal);background:var(--tmc-teal-light)}
.option-card .radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--tmc-gray-300);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
.option-card.selected .radio{border-color:var(--tmc-teal);background:var(--tmc-teal)}
.option-card.selected .radio::after{content:'';width:8px;height:8px;border-radius:50%;background:white}
.option-label{font-size:15px;font-weight:500;color:var(--tmc-navy)}
.option-desc{font-size:13px;color:var(--tmc-gray-600);margin-top:2px}
.risk-nudge{background:var(--tmc-coral-light);border-radius:var(--radius-sm);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;margin-top:4px;margin-bottom:10px;animation:nudgeIn .3s ease-out}
.risk-nudge-icon{font-size:16px;flex-shrink:0;line-height:1.4}
.risk-nudge-text{font-size:13px;color:#8b3a2a;line-height:1.5}
.skin-type-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:20px}
.skin-type-card{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;background:none;border:none;padding:4px}
.skin-swatch{width:52px;height:52px;border-radius:50%;border:3px solid transparent;box-shadow:0 2px 8px rgba(0,0,0,.18);transition:transform .15s,border-color .15s,box-shadow .15s}
.skin-type-card:hover .skin-swatch{transform:scale(1.1);box-shadow:0 4px 14px rgba(0,0,0,.25)}
.skin-type-card.selected .skin-swatch{border-color:var(--tmc-teal);box-shadow:0 0 0 3px rgba(46,196,182,.35),0 4px 14px rgba(0,0,0,.22);transform:scale(1.12)}
.skin-type-label{font-size:10px;font-weight:500;color:var(--tmc-gray-600)}
.photomode-card{border:2px solid var(--tmc-gray-200);border-radius:var(--radius-lg);padding:20px;cursor:pointer;transition:all .2s;background:var(--tmc-white);position:relative;margin-bottom:14px}
.photomode-card:hover,.photomode-card.recommended{border-color:var(--tmc-teal)}
.photomode-badge{position:absolute;top:-11px;left:20px;background:var(--tmc-teal);color:white;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.photomode-title{font-size:17px;font-weight:700;color:var(--tmc-navy);margin-bottom:6px}
.photomode-desc{font-size:13px;color:var(--tmc-gray-600);line-height:1.5}
.photo-tips-list{margin-top:20px;display:flex;flex-direction:column;gap:12px}
.photo-tip-row{display:flex;align-items:flex-start;gap:14px;background:var(--tmc-white);border:1px solid var(--tmc-gray-200);border-radius:var(--radius-md);padding:14px}
.photo-tip-emoji{font-size:22px;flex-shrink:0}
.photo-tip-body{font-size:13px;color:var(--tmc-gray-600);line-height:1.45}
.photo-tip-body strong{color:var(--tmc-navy);display:block;margin-bottom:2px;font-size:14px}
.capture-guide-frame{position:relative;border:2.5px dashed var(--tmc-teal);border-radius:var(--radius-lg);background:#f0fafa;display:flex;align-items:center;justify-content:center;padding:20px;margin:12px 0;min-height:220px}
.capture-tick-overlay{position:absolute;inset:0;background:rgba(46,196,182,.12);border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;font-size:64px}
.capture-photo-preview{width:100%;max-height:260px;object-fit:cover;border-radius:var(--radius-md)}
.capture-hint{text-align:center;font-size:12px;color:var(--tmc-gray-400);margin-top:4px;font-style:italic}
.capture-btn{display:block;width:100%;padding:18px;font-size:17px;font-weight:700;background:var(--tmc-teal);color:white;border:none;border-radius:var(--radius-xl);cursor:pointer;margin-top:16px}
.capture-btn:hover{background:var(--tmc-teal-dark)}
.capture-skip{display:block;text-align:center;font-size:13px;color:var(--tmc-gray-400);margin-top:14px;cursor:pointer;text-decoration:underline;background:none;border:none;width:100%}
.capture-retake{display:inline-block;font-size:13px;color:var(--tmc-gray-600);cursor:pointer;text-decoration:underline;background:none;border:none;margin-top:10px;text-align:center;width:100%}
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.summary-thumb{border-radius:var(--radius-sm);overflow:hidden;border:2px solid var(--tmc-gray-200);position:relative;aspect-ratio:3/4;background:var(--tmc-gray-100);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.summary-thumb img{width:100%;height:100%;object-fit:cover}
.summary-thumb.has-photo{border-color:var(--tmc-teal)}
.summary-thumb-label{font-size:10px;font-weight:600;color:var(--tmc-gray-600);text-align:center;padding:4px;background:rgba(255,255,255,.9);position:absolute;bottom:0;left:0;right:0}
.summary-thumb-empty{font-size:22px;margin-bottom:4px;opacity:.3}
.summary-thumb-retake{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:white;border:none;border-radius:20px;font-size:10px;padding:2px 7px;cursor:pointer}
.body-map-container{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:16px}
.body-map-svg{width:200px;cursor:pointer;overflow:visible}
.body-region-area{fill:transparent;stroke:none;cursor:pointer;transition:fill .2s}
.body-region-area:hover{fill:rgba(46,196,182,.18)}
.body-region-area.has-photo{fill:rgba(46,196,182,.22)}
.body-outline-path{fill:#f5ede4;stroke:var(--tmc-navy);stroke-width:1.5;stroke-linejoin:round}
.body-map-count{font-size:13px;color:var(--tmc-teal-dark);font-weight:600;text-align:center}
.region-dot{fill:var(--tmc-teal);stroke:white;stroke-width:1.5;pointer-events:none}
.photo-upload-zone{border:2px dashed var(--tmc-gray-300);border-radius:var(--radius-lg);padding:32px 20px;text-align:center;cursor:pointer;transition:all .2s;background:var(--tmc-white)}
.photo-upload-zone:hover{border-color:var(--tmc-teal);background:var(--tmc-teal-light)}
.photo-upload-icon{font-size:40px;margin-bottom:12px}
.photo-upload-text{font-size:15px;font-weight:500;color:var(--tmc-navy)}
.photo-upload-hint{font-size:13px;color:var(--tmc-gray-400);margin-top:4px}
.photo-preview{width:100%;border-radius:var(--radius-md);overflow:hidden;position:relative;margin-top:12px}
.photo-preview img{width:100%;height:200px;object-fit:cover;display:block}
.photo-preview-remove{position:absolute;top:8px;right:8px;width:28px;height:28px;background:rgba(0,0,0,.6);color:white;border:none;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.abcde-cards{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.abcde-card{display:flex;align-items:flex-start;gap:14px;background:var(--tmc-white);border-radius:var(--radius-md);padding:16px;border:1px solid var(--tmc-gray-200);transition:border-color .2s;cursor:pointer}
.abcde-card.checked{border-color:var(--tmc-coral);background:#fff8f6}
.abcde-letter{width:40px;height:40px;border-radius:50%;background:var(--tmc-navy);color:white;font-family:var(--font-display);font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s}
.abcde-card.checked .abcde-letter{background:var(--tmc-coral)}
.abcde-title{font-size:14px;font-weight:600;color:var(--tmc-navy)}
.abcde-desc{font-size:13px;color:var(--tmc-gray-600);margin-top:2px;line-height:1.4}
.consent-row{display:flex;align-items:flex-start;gap:12px;margin-top:16px}
.consent-checkbox{width:22px;height:22px;border:2px solid var(--tmc-gray-300);border-radius:4px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;margin-top:2px}
.consent-checkbox.checked{background:var(--tmc-teal);border-color:var(--tmc-teal)}
.consent-checkbox.checked::after{content:'✓';color:white;font-size:14px;font-weight:700}
.consent-text{font-size:13px;color:var(--tmc-gray-600);line-height:1.5}
.consent-text a{color:var(--tmc-teal);text-decoration:underline}
.input-group{margin-bottom:16px}
.input-label{font-size:14px;font-weight:600;color:var(--tmc-navy);margin-bottom:6px;display:block}
.input-field{width:100%;padding:14px 16px;border:2px solid var(--tmc-gray-200);border-radius:var(--radius-sm);font-family:var(--font-body);font-size:15px;color:var(--tmc-navy);transition:border-color .2s;background:var(--tmc-white)}
.input-field:focus{outline:none;border-color:var(--tmc-teal)}
.input-field::placeholder{color:var(--tmc-gray-400)}
.clinic-card{background:var(--tmc-white);border-radius:var(--radius-md);padding:16px;border:1px solid var(--tmc-gray-200);display:flex;gap:14px;align-items:center;margin-bottom:10px;transition:all .2s}
.clinic-card:hover{border-color:var(--tmc-teal);box-shadow:var(--shadow-sm)}
.clinic-card.recommended{border:2px solid var(--tmc-teal)}
.clinic-icon{width:44px;height:44px;background:var(--tmc-teal-light);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.clinic-name{font-size:15px;font-weight:600;color:var(--tmc-navy)}
.clinic-distance{font-size:13px;color:var(--tmc-gray-600)}
.clinic-book-btn{background:var(--tmc-teal);color:white;border:none;border-radius:var(--radius-sm);padding:8px 14px;font-family:var(--font-body);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .2s;margin-left:auto;flex-shrink:0}
.clinic-book-btn:hover{background:var(--tmc-teal-dark)}
.service-card{background:linear-gradient(135deg,var(--tmc-navy),var(--tmc-navy-light));border-radius:var(--radius-lg);padding:24px;color:white;margin-bottom:16px;position:relative;overflow:hidden}
.service-card::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(46,196,182,.12) 0%,transparent 70%)}
.service-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px}
.service-badge-rec{background:var(--tmc-teal);color:white}
.service-badge-pop{background:var(--tmc-gold);color:var(--tmc-navy)}
.service-name{font-family:var(--font-display);font-size:22px;font-weight:600;margin-bottom:8px}
.service-desc{font-size:14px;opacity:.82;line-height:1.55}
.service-price{font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--tmc-gold);margin-top:14px}
.risk-factor-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--tmc-gray-100);font-size:14px;color:var(--tmc-navy)}
.risk-factor-item:last-child{border-bottom:none}
.risk-factor-dot{width:8px;height:8px;border-radius:50%;background:var(--tmc-coral);flex-shrink:0;margin-top:5px}
.risk-factor-dot.low{background:var(--tmc-teal)}
.tag{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}
.tag-low{background:#e8f5e9;color:#2e7d32}
.tag-moderate{background:#fff3e0;color:#e65100}
.tag-high{background:#fce4ec;color:#c62828}
.tag-veryhigh{background:#f3e5f5;color:#6a1b9a}
.welcome-hero{background:linear-gradient(160deg,var(--tmc-navy) 0%,#2a3f5a 50%,var(--tmc-navy-light) 100%);border-radius:0 0 var(--radius-xl) var(--radius-xl);padding:48px 24px 40px;text-align:center;color:white;position:relative;overflow:hidden}
.welcome-hero::before{content:'';position:absolute;top:-50%;right:-20%;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(46,196,182,.15) 0%,transparent 70%)}
.welcome-hero-logo{position:relative;z-index:1;margin:0 auto 32px auto}
.welcome-hero .title-xl{color:white;position:relative;z-index:1}
.welcome-hero .subtitle{color:rgba(255,255,255,.78);position:relative;z-index:1}
.welcome-stat{display:inline-block;background:rgba(255,255,255,.12);border-radius:var(--radius-sm);padding:8px 14px;font-size:13px;color:rgba(255,255,255,.9);margin-top:16px;position:relative;z-index:1;backdrop-filter:blur(4px)}
.welcome-social-proof{font-size:13px;color:rgba(255,255,255,.7);margin-top:10px;position:relative;z-index:1}
.feature-list{margin-top:24px}
.feature-item{display:flex;align-items:flex-start;gap:14px;padding:14px 0}
.feature-icon{width:40px;height:40px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.feature-icon-teal{background:var(--tmc-teal-light)}
.feature-icon-coral{background:var(--tmc-coral-light)}
.feature-icon-gold{background:#fdf5e6}
.feature-title{font-size:15px;font-weight:600;color:var(--tmc-navy)}
.feature-desc{font-size:13px;color:var(--tmc-gray-600);margin-top:2px;line-height:1.4}
.disclaimer{background:var(--tmc-gray-100);border-radius:var(--radius-sm);padding:14px 16px;font-size:12px;color:var(--tmc-gray-600);line-height:1.5;margin-top:20px}
.disclaimer strong{color:var(--tmc-gray-800)}
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;text-align:center;padding:40px 24px}
.loading-body-wrap{position:relative;width:100px;height:200px;margin-bottom:28px}
.loading-scan-line{position:absolute;left:0;top:0;width:100%;height:3px;background:linear-gradient(90deg,transparent,var(--tmc-teal),transparent);border-radius:2px;animation:scanLine 1.8s ease-in-out infinite;box-shadow:0 0 8px var(--tmc-teal)}
.loading-body-svg{animation:bodyPulse 1.8s ease-in-out infinite}
.loading-msg{font-size:15px;color:var(--tmc-gray-600);animation:fadeIn .4s ease-out;min-height:22px}
.share-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.share-btn{flex:1;min-width:70px;padding:11px 8px;border-radius:var(--radius-sm);border:1px solid var(--tmc-gray-200);background:var(--tmc-white);cursor:pointer;font-family:var(--font-body);font-size:12px;font-weight:600;color:var(--tmc-navy);transition:all .2s;text-align:center}
.share-btn:hover{border-color:var(--tmc-teal);background:var(--tmc-teal-light)}
.divider{height:1px;background:var(--tmc-gray-200);margin:20px 0}
.trust-badge{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tmc-gray-600);margin-top:16px;justify-content:center}
.screen-footer{text-align:center;padding:12px 20px 8px;font-size:11px;color:var(--tmc-gray-400);border-top:1px solid var(--tmc-gray-200);margin-top:auto}
.screen-footer a{color:var(--tmc-gray-400);text-decoration:none}
.screen-footer a:hover{color:var(--tmc-teal)}
/* ===== TOGGLE SWITCH ===== */
.toggle-wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0}
.toggle-switch{position:relative;display:inline-block;width:52px;height:28px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0;position:absolute}
.toggle-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#ccc;border-radius:28px;transition:.3s}
.toggle-slider:before{position:absolute;content:"";height:22px;width:22px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.3s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
input:checked+.toggle-slider{background:var(--tmc-teal)}
input:checked+.toggle-slider:before{transform:translateX(24px)}
.toggle-label-text{font-size:15px;font-weight:600;color:var(--tmc-navy)}
.toggle-label-sub{font-size:12px;color:var(--tmc-gray-600);margin-top:2px}
/* ===== HOMEPAGE ===== */
.hp-screen{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--tmc-cream)}
.hp-header{background:linear-gradient(160deg,var(--tmc-navy) 0%,#1e3250 100%);padding:48px 20px 28px;position:relative;overflow:hidden}
.hp-header::before{content:'';position:absolute;top:-30%;right:-15%;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(46,196,182,.12) 0%,transparent 70%)}
.hp-logo{margin-bottom:14px;position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between}
.hp-logo img{height:60px;width:auto;display:block;}
.hp-reset-link{font-size:11px;color:rgba(255,255,255,.4);cursor:pointer;background:none;border:none;font-family:var(--font-body);text-decoration:underline;padding:0}
.hp-reset-link:hover{color:rgba(255,255,255,.7)}
.hp-greeting{font-family:var(--font-display);font-size:28px;font-weight:600;color:white;line-height:1.2;position:relative;z-index:1}
.hp-meta{display:flex;align-items:center;gap:8px;margin-top:8px;position:relative;z-index:1;flex-wrap:wrap}
.hp-date{font-size:13px;color:rgba(255,255,255,.65)}
.hp-location{font-size:13px;color:rgba(255,255,255,.75);display:flex;align-items:center;gap:4px}
.hp-content{flex:1;padding:20px 16px 100px;overflow-y:auto}
.hp-section-label{font-size:11px;font-weight:700;color:var(--tmc-gray-400);text-transform:uppercase;letter-spacing:1.2px;margin:20px 0 10px}
.hp-section-label:first-child{margin-top:0}
/* ===== UV CARD ===== */
.uv-card{background:var(--tmc-white);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-md);border:1px solid var(--tmc-gray-200);margin-bottom:4px;overflow:visible}
.uv-gauge-wrap{display:flex;justify-content:center;margin-bottom:8px}
.uv-value-row{display:flex;align-items:baseline;justify-content:center;gap:8px;margin-bottom:6px}
.uv-value{font-family:var(--font-display);font-size:40px;font-weight:700;color:var(--tmc-navy);line-height:1}
.uv-value-label{font-size:12px;color:var(--tmc-gray-400);align-self:flex-end;padding-bottom:4px}
.uv-level-badge{display:inline-block;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.5px;text-align:center;margin:0 auto 12px;display:block;width:fit-content;margin-left:auto;margin-right:auto}
.uv-spf-rec{background:var(--tmc-teal-light);border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;color:var(--tmc-navy);line-height:1.5;margin-bottom:10px}
.uv-spf-rec strong{color:var(--tmc-teal-dark)}
.uv-spf-note{font-size:11px;color:var(--tmc-gray-600);font-style:italic;margin-top:4px}
.uv-peak-alert{background:#fff8e1;border:1px solid #ffe082;border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;color:#f57f17;font-weight:500;margin-bottom:10px;display:none}
.uv-weather-row{display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;color:var(--tmc-gray-600);padding-top:8px;border-top:1px solid var(--tmc-gray-100)}
.uv-loading-state{text-align:center;padding:24px 0}
.uv-loading-spinner{width:28px;height:28px;border:3px solid var(--tmc-gray-200);border-top-color:var(--tmc-teal);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 10px}
.uv-unavailable{text-align:center;padding:20px 0;color:var(--tmc-gray-400);font-size:13px}
.uv-unavailable-icon{font-size:28px;margin-bottom:8px}

.travel-banner{background:linear-gradient(135deg,#1a3a2a,#1e4d35);border-radius:var(--radius-lg);padding:16px;margin-bottom:16px;color:white;position:relative}
.travel-banner-title{font-size:15px;font-weight:700;margin-bottom:4px}
.travel-banner-body{font-size:13px;opacity:.85;line-height:1.5;margin-bottom:12px}
.travel-banner-actions{display:flex;gap:8px}
.travel-banner-book{flex:1;padding:10px;background:var(--tmc-teal);color:white;border:none;border-radius:var(--radius-sm);font-family:var(--font-body);font-size:13px;font-weight:600;cursor:pointer}
.travel-banner-dismiss{padding:10px 14px;background:rgba(255,255,255,.12);color:white;border:none;border-radius:var(--radius-sm);font-family:var(--font-body);font-size:13px;cursor:pointer}

.collapsible-header{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:14px 16px;background:var(--tmc-white);border-radius:var(--radius-md);border:1px solid var(--tmc-gray-200);margin-bottom:2px;transition:background .2s}
.collapsible-header:hover{background:var(--tmc-gray-100)}
.collapsible-title{font-size:14px;font-weight:600;color:var(--tmc-navy)}
.collapsible-chevron{font-size:12px;color:var(--tmc-gray-400);transition:transform .3s}
.collapsible-chevron.open{transform:rotate(180deg)}
.collapsible-body{overflow:hidden;max-height:0;transition:max-height .4s ease-out,opacity .3s;opacity:0}
.collapsible-body.open{max-height:2000px;opacity:1;transition:max-height .5s ease-in,opacity .3s}
.collapsible-inner{padding:14px 0 4px}
/* ===== RISK SCORE GAUGE (homepage) ===== */
.hp-gauge-wrap{text-align:center;margin:8px 0 4px}

.rec-card{background:var(--tmc-white);border-radius:var(--radius-lg);padding:16px 18px;box-shadow:var(--shadow-sm);border:1px solid var(--tmc-gray-200)}
.rec-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--tmc-gray-100);font-size:13px;color:var(--tmc-navy);line-height:1.55}
.rec-item:last-child{border-bottom:none;padding-bottom:0}
.rec-dot{width:8px;height:8px;border-radius:50%;background:var(--tmc-teal);flex-shrink:0;margin-top:5px}
/* ===== BOOK CTA ===== */
.book-card{background:linear-gradient(135deg,var(--tmc-navy),var(--tmc-navy-light));border-radius:var(--radius-lg);padding:20px;color:white;margin-bottom:4px}
.book-card-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.1);font-size:13px}
.book-card-row:last-of-type{border-bottom:none;margin-bottom:14px}
.book-card-label{color:rgba(255,255,255,.65)}
.book-card-value{color:white;font-weight:600}
.freq-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.freq-low{background:rgba(76,175,80,.25);color:#a5d6a7}
.freq-mod{background:rgba(255,179,0,.2);color:#ffe082}
.freq-high{background:rgba(255,112,67,.25);color:#ffab91}
.freq-veryhigh{background:rgba(229,57,53,.25);color:#ef9a9a}
.book-btn-hp{width:100%;padding:16px;background:var(--tmc-teal);color:white;font-family:var(--font-display);font-size:17px;font-weight:600;border:none;border-radius:var(--radius-md);cursor:pointer;animation:pulseCTA 2.5s ease-in-out infinite;transition:background .2s;letter-spacing:.2px}
.book-btn-hp:hover{background:var(--tmc-teal-dark);animation:none}
/* ===== PROFILE SUMMARY IN HOMEPAGE ===== */
.hp-profile-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--tmc-gray-100);font-size:14px}
.hp-profile-label{color:var(--tmc-gray-600)}
.hp-profile-value{font-weight:600;color:var(--tmc-navy);display:flex;align-items:center;gap:6px}
/* ===== METHODOLOGY ===== */
.methodology-section{background:var(--tmc-white);border-radius:var(--radius-lg);padding:16px;margin-bottom:16px;border:1px solid var(--tmc-gray-200)}
.methodology-inner{margin-top:12px}
.ref-item{padding:10px 0;border-bottom:1px solid var(--tmc-gray-100);font-size:12px;color:var(--tmc-gray-600);line-height:1.5}
.ref-item:last-child{border-bottom:none}
.ref-item strong{color:var(--tmc-navy);display:block;font-size:13px;margin-bottom:2px}
.hp-footer{text-align:center;padding:16px 0 8px;font-size:11px;color:var(--tmc-gray-400)}
.hp-footer a{color:var(--tmc-gray-400);text-decoration:none}
/* ===== DEV TOOLBAR ===== */
.dev-toolbar{position:fixed;bottom:20px;left:20px;z-index:9999;background:rgba(0,0,0,.72);border-radius:20px;padding:5px 10px;display:flex;gap:6px;backdrop-filter:blur(4px)}
.dev-toolbar button{background:none;border:none;color:rgba(255,255,255,.9);font-size:11px;font-family:var(--font-body);cursor:pointer;padding:4px 8px;border-radius:10px;transition:background .2s;white-space:nowrap}
.dev-toolbar button:hover{background:rgba(255,255,255,.15)}
/* ===== CONSENT SCREEN ICON ===== */
.consent-icon{font-size:44px;text-align:center;margin-bottom:16px}
.consent-info-box{background:var(--tmc-gray-100);border-radius:var(--radius-sm);padding:12px 14px;font-size:12px;color:var(--tmc-gray-600);line-height:1.5;margin-top:12px}
.consent-success-box{background:var(--tmc-teal-light);border:1px solid rgba(46,196,182,.3);border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;color:var(--tmc-teal-dark);margin-top:12px;display:flex;gap:8px;align-items:flex-start}
/* ===== RESPONSIVE ===== */
@media(max-width:380px){.title-xl{font-size:26px}.title-lg{font-size:22px}.hp-greeting{font-size:24px}}

// EADO (European Association of Dermato-Oncology) UV Protection Scale
function getUVBand(uv){
  if(uv<=2) return{level:'LOW',color:'#4caf50',bg:'#e8f5e9',text:'#2e7d32'};
  if(uv<=5) return{level:'MODERATE',color:'#ffb300',bg:'#fff8e1',text:'#f57f17'};
  if(uv<=7) return{level:'HIGH',color:'#ff7043',bg:'#fff3e0',text:'#bf360c'};
  if(uv<=10) return{level:'VERY HIGH',color:'#e53935',bg:'#ffebee',text:'#b71c1c'};
  return{level:'EXTREME',color:'#8e24aa',bg:'#f3e5f5',text:'#4a148c'};
}
// EADO recommended protection per UV band
function getEADOProtection(uv){
  if(uv<=2) return{spf:null,msg:'No protection required'};
  if(uv<=5) return{spf:'30+',msg:'SPF 30+, hat, and sunglasses'};
  if(uv<=7) return{spf:'30–50',msg:'SPF 30–50, seek shade at solar noon'};
  if(uv<=10) return{spf:'50+',msg:'SPF 50+, avoid solar noon, cover up'};
  return{spf:'50+',msg:'SPF 50+, stay indoors at solar noon'};
}
// Bias-corrected SPF recommendation per Gadare et al., MIT 2026 debiasing principle:
// Models trained predominantly on lighter skin tones underestimate risk for darker tones.
// Monk tones 1-3 (lightest): move one EADO protection level up
// Monk tones 4-6 (medium): standard EADO
// Monk tones 7-10 (darker): standard EADO + note that melanoma risk is equal regardless of tone
function getPersonalisedSPF(uv,monkTone){
  const levels=[
    {spf:null,msg:'No protection required'},
    {spf:'30+',msg:'SPF 30+, hat, and sunglasses'},
    {spf:'30–50',msg:'SPF 30–50, seek shade at solar noon'},
    {spf:'50+',msg:'SPF 50+, avoid solar noon, cover up'},
    {spf:'50+',msg:'SPF 50+, stay indoors at solar noon'},
  ];
  let idx=uv<=2?0:uv<=5?1:uv<=7?2:uv<=10?3:4;
  let note=null;
  if(monkTone<=3) idx=Math.min(idx+1,4);
  if(monkTone>=7) note='Darker skin tones have lower natural SPF but equal melanoma risk — do not rely on skin tone as protection. Use stated SPF.';
  return{...levels[idx],note};
}
// UV gauge SVG — half-circle arc with EADO-coloured band segments and needle
function renderUVGaugeSVG(uv){
  const cx=110,cy=100,r=88,sw=14;
  const d2r=d=>d*Math.PI/180;
  const pt=(a,rad)=>[cx+rad*Math.cos(d2r(a)),cy-rad*Math.sin(d2r(a))];
  const seg=(a1,a2,col)=>{
    const[x1,y1]=pt(a1,r),[x2,y2]=pt(a2,r);
    return`<path d="M${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 0 1 ${x2.toFixed(1)},${y2.toFixed(1)}" stroke="${col}" stroke-width="${sw}" fill="none" stroke-linecap="butt"/>`;
  };
  const uvN=Math.min(Math.max(uv||0,0),12);
  const na=180-(uvN/12)*180;
  const[nx,ny]=pt(na,74);
  return`<svg viewBox="0 0 220 105" width="220" height="105" xmlns="http://www.w3.org/2000/svg">
    <path d="M22,${cy} A${r},${r} 0 0 1 198,${cy}" stroke="#e8e8e8" stroke-width="${sw}" fill="none"/>
    ${seg(180,150,'#4caf50')}${seg(150,105,'#ffb300')}${seg(105,75,'#ff7043')}${seg(75,30,'#e53935')}${seg(30,0,'#8e24aa')}
    <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="#1a2332" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="8" fill="#1a2332"/>
    <text x="22" y="${cy+18}" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="9" fill="#4caf50" font-weight="600">LOW</text>
    <text x="198" y="${cy+18}" text-anchor="end" font-family="DM Sans,sans-serif" font-size="9" fill="#8e24aa" font-weight="600">EXTREME</text>
  </svg>`;
}

// ===== WEATHER API (Open-Meteo, keyless) =====
async function fetchWeatherAndUV(lat,lon){
  try{
    const[uvRes,wxRes]=await Promise.all([
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=uv_index&timezone=auto`),
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,wind_speed_10m&timezone=auto`)
    ]);
    const uvD=await uvRes.json(),wxD=await wxRes.json();
    return{uv:uvD.current.uv_index,temp:wxD.current.temperature_2m,weatherCode:wxD.current.weather_code,windSpeed:wxD.current.wind_speed_10m};
  }catch(e){return null;}
}

    return{city:d.address.city||d.address.town||d.address.village||d.address.county||'',country:d.address.country||'',country_code:d.address.country_code||''};

}

function checkTravelStatus(profile){
  const h=getLocationHistory();
  if(h.length<3)return{isAway:false,justReturned:false};
  const home=profile.homeCountry||'gb';
  const getCC=e=>e.country_code||e.country;
  const last3=h.slice(-3);
  const allAway=last3.every(e=>getCC(e)&&getCC(e)!==home);
  const currentCC=getCC(h[h.length-1]);
  const currentlyHome=currentCC===home;
  if(allAway)return{isAway:true,justReturned:false};
  if(profile.awayFromHome&&currentlyHome)return{isAway:false,justReturned:true};
  return{isAway:false,justReturned:false};
}

// Max possible score: 83 (questions) + 6 (skin type) + 20 (ABCDE) = 109
function calculateRiskScore(){
  let total=0;
  questions.forEach(q=>{
    const a=st.answers[q.id];
    if(a){const opt=q.options.find(o=>o.value===a);if(opt)total+=opt.score;}
  });
  if(st.skinType){const sk=skinTypes.find(s=>s.id===st.skinType);if(sk)total+=sk.score;}
  total+=Object.values(st.abcdeAnswers).filter(Boolean).length*4;
  return Math.min(Math.max(Math.round((total/109)*100),5),95);
}

function generateRecommendations(profile,wd){
  const recs=[];
  const{answers,skinType,riskLevel}=profile;
  const uv=wd&&wd.uv!=null?wd.uv:null;
  const hour=new Date().getHours();
  // NHS skin cancer prevention: daily SPF is the single most effective preventive measure
  if(answers.sunscreen_use==='rarely'||answers.sunscreen_use==='holiday')
    recs.push('Apply SPF 30+ sunscreen daily — UV rays penetrate cloud cover year-round. This is the single most effective preventive measure per NHS skin cancer prevention guidance.');
  else if(uv!=null&&uv>=3){
    const sp=getPersonalisedSPF(uv,skinType);
    recs.push(`Today’s UV is ${Math.round(uv)} (${getUVBand(uv).level}). ${sp.msg}${sp.spf?' — reapply every 2 hours when outdoors':''}.`);
  }
  // EADO: changing moles warrant urgent assessment
  if(answers.changing_moles==='yes_multiple'||answers.changing_moles==='yes_one')
    recs.push('You reported mole changes. EADO guidance recommends any changing mole be assessed by a dermatologist promptly. Do not delay booking a check.');
  // NHS: family history warrants earlier and more frequent screening
  if(answers.family_history==='yes_immediate'||answers.family_history==='yes_extended')
    recs.push('With a family history of skin cancer, annual professional skin checks are strongly recommended — earlier and more frequently than the general population guideline (NHS guidance).');
  // Risk-based check frequency
  if(riskLevel==='VERY HIGH'||riskLevel==='HIGH')
    recs.push('Your risk profile indicates a professional full-body mole check every 6 months is recommended. Early detection dramatically improves outcomes (NHS Cancer Research data).');
  else if(riskLevel==='MODERATE'&&!recs.some(r=>r.includes('annually')))
    recs.push('We recommend a professional skin check annually. Your profile includes factors that warrant regular monitoring by a qualified dermatologist.');
  // High mole count: self-monitoring
  if(answers.mole_count==='50plus'||answers.mole_count==='20-50')
    recs.push('With a high mole count, keep a monthly photo log of any moles that change in size, shape, or colour. Use the ABCDE rule as your guide.');
  // Outdoor exposure
  if(answers.outdoor_work==='both'||answers.outdoor_work==='work_outdoor')
    recs.push('Your high outdoor UV exposure means protective clothing (UPF 50+), a wide-brimmed hat, and UV-blocking sunglasses are essential alongside daily SPF use.');
  // Peak UV alert
  if(hour>=11&&hour<=15&&uv!=null&&uv>=3)
    recs.push('☀️ You are currently in the peak UV window (11:00–15:00). Seek shade, wear a hat, and avoid prolonged direct sun exposure right now.');
  // Darker skin tone equal risk note (Gadare et al., MIT 2026 debiasing principle)
  if(skinType>=7&&!recs.some(r=>r.includes('melanoma risk')))
    recs.push('Research shows darker skin tones carry equal melanoma risk to lighter tones but face lower likelihood of early detection. Regular professional checks are equally important regardless of skin tone.');
  return recs.slice(0,5);
}

function getDefaultSPFRec(monkTone){
  if(monkTone<=3)return'We recommend <strong>SPF 50+</strong> as your daily minimum given your skin type.';
  if(monkTone<=6)return'We recommend <strong>SPF 30–50</strong> as your daily minimum.';
  return'Apply <strong>SPF 30+</strong> daily — melanoma risk is equal across all skin tones regardless of natural pigmentation.';
}
function buildUVCardHtml(wd,p,hour){
  const isPeak=hour>=11&&hour<=15;
  if(wd&&wd.uv!=null){
    const band=getUVBand(wd.uv),spf=getPersonalisedSPF(wd.uv,p.skinType),showPeak=isPeak&&wd.uv>=3;
    const spfAction=spf.spf?(spf.msg.replace(/^SPF [^,]+,\s*/,'')||spf.msg).replace(/^./,c=>c.toUpperCase()):'';
    return`<div id="hp-uv-loading" style="display:none"></div><div id="hp-uv-data">
      <div class="uv-gauge-wrap" id="hp-uv-gauge">${renderUVGaugeSVG(wd.uv)}</div>
      <div class="uv-value-row"><div class="uv-value" id="hp-uv-value">${Math.round(wd.uv)}</div><div class="uv-value-label">UV Index</div></div>
      <div class="uv-level-badge" id="hp-uv-level" style="background:${band.bg};color:${band.text}">${band.level}</div>
      <div class="uv-spf-rec" id="hp-spf-msg">${spf.spf?`Based on your current location, the current weather and your skin profile, we recommend <strong>SPF ${spf.spf}</strong> today. ${spfAction}.`:'No sun protection required at current UV levels.'}${spf.note?`<div class="uv-spf-note">${spf.note}</div>`:''}</div>
      <div class="uv-peak-alert" id="hp-peak-uv" style="display:${showPeak?'block':'none'}">&#9728;&#65039; You are in the peak UV window right now (11:00–15:00)</div>
      <div class="uv-weather-row" id="hp-weather-summary"><span style="font-size:20px">${getWeatherEmoji(wd.weatherCode)}</span><span>${Math.round(wd.temp)}°C · ${getWeatherDesc(wd.weatherCode)}</span></div>
    </div>`;
  }
  if(!p.consentLocation){
    const defSPF=getDefaultSPFRec(p.skinType);
    if(p.postcode){
      return`<div id="hp-uv-loading" class="uv-loading-state"><div class="uv-loading-spinner"></div><div style="font-size:13px;color:var(--tmc-gray-400)">Fetching UV data for your area…</div><div class="uv-spf-rec" style="margin-top:12px">${defSPF}</div></div>
      <div id="hp-uv-data" style="display:none">
        <div class="uv-gauge-wrap" id="hp-uv-gauge"></div>
        <div class="uv-value-row"><div class="uv-value" id="hp-uv-value">—</div><div class="uv-value-label">UV Index</div></div>
        <div class="uv-level-badge" id="hp-uv-level" style="display:none"></div>
        <div class="uv-spf-rec" id="hp-spf-msg" style="display:none"></div>
        <div id="hp-peak-uv" class="uv-peak-alert" style="display:none"></div>
        <div id="hp-weather-summary" class="uv-weather-row" style="display:none"></div>
      </div>`;
    }
    return`<div id="hp-uv-loading" style="display:none"></div><div id="hp-uv-data"><div class="uv-unavailable">
      <div class="uv-unavailable-icon">&#128205;</div><div style="font-size:14px;font-weight:600;color:var(--tmc-navy)">Location not enabled</div>
      <div style="margin-top:4px;font-size:12px">Enable location permission in your browser to see live UV data for your area.</div>
    </div><div class="uv-spf-rec" style="margin-top:12px">${defSPF}</div></div>`;
  }
  return`<div id="hp-uv-loading" class="uv-loading-state"><div class="uv-loading-spinner"></div><div style="font-size:13px;color:var(--tmc-gray-400)">Fetching UV data…</div><div class="uv-spf-rec" style="margin-top:12px">${getDefaultSPFRec(p.skinType)}</div></div>
  <div id="hp-uv-data" style="display:none">
    <div class="uv-gauge-wrap" id="hp-uv-gauge"></div>
    <div class="uv-value-row"><div class="uv-value" id="hp-uv-value">—</div><div class="uv-value-label">UV Index</div></div>
    <div class="uv-level-badge" id="hp-uv-level" style="display:none"></div>
    <div class="uv-spf-rec" id="hp-spf-msg" style="display:none"></div>
    <div id="hp-peak-uv" class="uv-peak-alert" style="display:none"></div>
    <div id="hp-weather-summary" class="uv-weather-row" style="display:none"></div>
  </div>`;
}

        <button class="travel-banner-book" onclick="window.open('https://www.themoleclinic.co.uk/book','_blank')">Book a Mole Check &#8594;</button>

      </div></div>`:''}
    <div class="hp-content">
      <div class="hp-section-label">Today's Skin Safety</div>
      <div class="uv-card">${buildUVCardHtml(wd,p,hour)}</div>
      <div style="margin-top:16px">
        <div class="collapsible-header" onclick="toggleProfile()">
          <div class="collapsible-title">&#129505; Your Risk Profile</div>
          <div class="collapsible-chevron ${st.profileExpanded?'open':''}" id="profileChevron">&#9660;</div>
        </div>
        <div class="collapsible-body ${st.profileExpanded?'open':''}" id="profileCollapse">

              <p style="font-size:13px;color:var(--tmc-gray-600);line-height:1.55;margin-top:12px;padding:0 4px">${summary}</p>
            </div>
            <div class="card" style="margin-bottom:12px">
              <div class="hp-profile-row"><span class="hp-profile-label">Skin tone</span><span class="hp-profile-value">${skinTone?`<span style="display:inline-block;width:18px;height:18px;border-radius:50%;background:${skinTone.color};border:1.5px solid rgba(0,0,0,.15)"></span> Monk Tone ${p.skinType} of 10`:'-'}</span></div>
              <div class="hp-profile-row"><span class="hp-profile-label">Age range</span><span class="hp-profile-value">${questions[0].options.find(o=>o.value===p.answers.age)?.label||'—'}</span></div>

        </div>
        <div class="collapsible-body" id="methCollapse">
          <div class="methodology-section">
            <div class="methodology-inner">
              <div class="ref-item"><strong>Google Monk Skin Tone Scale (MST)</strong>Ellis Monk, Harvard University / Google, 2019. A 10-point scale representing the full range of human skin tones, used here for skin type categorisation.</div>
              <div class="ref-item"><strong>EADO UV Protection Guidelines</strong>European Association of Dermato-Oncology. Sun protection recommendations stratified by UV Index, implemented as the five-band EADO UV Protection Scale in this app.</div>
              <div class="ref-item"><strong>NHS Skin Cancer Prevention Guidelines</strong>NHS England. Evidence-based guidance on sun protection, risk factors, and early detection. Informs check frequencies and daily SPF advice throughout this app.</div>
              <div class="ref-item"><strong>Bias-Corrected Risk Weighting — Gadare et al., MIT (2026)</strong>AI models and risk tools trained predominantly on lighter skin tones systematically underestimate risk for darker tones. Per the Gadare et al. debiasing principle, this app applies corrective adjustments: Monk Tones 1–3 receive a one-level-up SPF recommendation, and Tones 7–10 receive an explicit equality-of-risk note to counter the under-detection bias documented in the literature.</div>
              <div class="ref-item"><strong>Fitzpatrick Phototype Scale</strong>Thomas Fitzpatrick, Harvard Medical School, 1975. Six-type classification of human skin phototype, shown here as a Fitzpatrick-equivalent label derived from the selected MST tone.</div>
              <div class="ref-item" style="border-bottom:none"><em>This app is a risk profiling tool and does not constitute medical advice. For clinical assessment, consult a qualified dermatologist. The Mole Clinic recommends regular professional skin checks regardless of risk level.</em></div>
            </div>
          </div>
        </div>
      </div>
      <div class="hp-footer"><p>v0.2 &middot; <a href="https://themoleclinic.co.uk" target="_blank">The Mole Clinic</a></p></div>
    </div>
    ${window.location.search.includes('dev=1')?`<div class="dev-toolbar"><button onclick="devSimulateHolidayReturn()">&#127757; Simulate holiday return</button><button onclick="devResetTravel()">&#128260; Reset travel data</button></div>`:''}
  </div>`;
}
// ===== TOGGLE HELPERS =====
function toggleProfile(){
  st.profileExpanded=!st.profileExpanded;
  const col=document.getElementById('profileCollapse');
  const chev=document.getElementById('profileChevron');
  if(col){col.classList.toggle('open',st.profileExpanded);}
  if(chev){chev.classList.toggle('open',st.profileExpanded);}
  if(st.profileExpanded)setTimeout(()=>animateRiskGauge(),150);
}
function toggleMethodology(){
  const col=document.getElementById('methCollapse');
  const chev=document.getElementById('methChevron');
  if(col){const open=col.classList.toggle('open');if(chev)chev.classList.toggle('open',open);}
}
function animateRiskGauge(){
  const fill=document.getElementById('hpGaugeFill');
  const scoreEl=document.getElementById('hpGaugeScore');
  const profile=st.profile;
  if(!fill||!scoreEl||!profile)return;
  const score=profile.riskScore||0;
  fill.style.strokeDashoffset=283*(1-Math.min(score/100,1));
  let cur=0;
  const timer=setInterval(()=>{cur++;scoreEl.textContent=cur;if(cur>=score){clearInterval(timer);scoreEl.textContent=score;}},1600/Math.max(score,1));
}
function animateRiskGaugeIfOpen(){if(st.profileExpanded)animateRiskGauge();}
// ===== ASYNC HOMEPAGE INIT =====
function updateWeatherUI(wd,geo){
  const hour=new Date().getHours(),isPeak=hour>=11&&hour<=15;
  const band=getUVBand(wd.uv),spf=getPersonalisedSPF(wd.uv,st.profile.skinType),showPeak=isPeak&&wd.uv>=3;
  const loadEl=document.getElementById('hp-uv-loading'),dataEl=document.getElementById('hp-uv-data');
  if(loadEl)loadEl.style.display='none';
  if(dataEl)dataEl.style.display='block';
  const gaugeEl=document.getElementById('hp-uv-gauge');
  if(gaugeEl)gaugeEl.innerHTML=renderUVGaugeSVG(wd.uv);
  const valEl=document.getElementById('hp-uv-value');
  if(valEl)valEl.textContent=Math.round(wd.uv);
  const lvlEl=document.getElementById('hp-uv-level');
  if(lvlEl){lvlEl.textContent=band.level;lvlEl.style.background=band.bg;lvlEl.style.color=band.text;lvlEl.style.display='block';}
  const spfEl=document.getElementById('hp-spf-msg');
  if(spfEl){const spfAction=spf.spf?(spf.msg.replace(/^SPF [^,]+,\s*/,'')||spf.msg).replace(/^./,c=>c.toUpperCase()):'';spfEl.style.display='block';spfEl.innerHTML=spf.spf?`Based on your current location, the current weather and your skin profile, we recommend <strong>SPF ${spf.spf}</strong> today. ${spfAction}.`:'No sun protection required at current UV levels.';if(spf.note)spfEl.innerHTML+=`<div class="uv-spf-note">${spf.note}</div>`;}
  const peakEl=document.getElementById('hp-peak-uv');
  if(peakEl){if(showPeak){peakEl.innerHTML='&#9728;&#65039; You are in the peak UV window right now (11:00–15:00)';peakEl.style.display='block';}else{peakEl.style.display='none';}}
  const wxEl=document.getElementById('hp-weather-summary');
  if(wxEl){wxEl.style.display='flex';wxEl.innerHTML=`<span style="font-size:20px">${getWeatherEmoji(wd.weatherCode)}</span><span>${Math.round(wd.temp)}°C · ${getWeatherDesc(wd.weatherCode)}</span>`;}
  if(geo&&geo.city){
    st.currentCity=geo.city;
    const cityEl=document.getElementById('hp-city');if(cityEl)cityEl.textContent=geo.city;
    const cityWrap=document.getElementById('hp-city-wrap');if(cityWrap)cityWrap.style.display='flex';
  }
  st.weatherData=wd;
}
async function initHomepageAsync(){
  const p=st.profile;if(!p)return;
  if(p.consentLocation){
    // Re-call GPS only when location is stale (>4h) or not yet captured
    const stale=!p.lat||!p.lon||!p.locationTimestamp||(Date.now()-p.locationTimestamp)>(4*60*60*1000);
    if(stale){
      try{
        const pos=await getCurrentPosition();
        const{latitude:lat,longitude:lon}=pos.coords;
        const geo=await reverseGeocode(lat,lon);
        // Save refreshed location to profile
        const up={...st.profile,lat,lon,locationTimestamp:Date.now(),city:geo.city||st.profile.city,country:geo.country||st.profile.country,country_code:geo.country_code||st.profile.country_code,homeCountry:st.profile.homeCountry||(geo.country_code||geo.country)};
        saveProfile(up);st.profile=up;
        // Travel detection
        if(up.consentTravel&&geo.country){
          logLocationEntry(lat,lon,geo.country,geo.country_code);
          const ts=checkTravelStatus(up);
          if(ts.justReturned&&shouldShowTravelBanner()){
            st.showTravelBanner=true;
            const up2={...up,awayFromHome:false};saveProfile(up2);st.profile=up2;
            const banner=document.querySelector('.travel-banner');
            if(!banner){render();return;}
          }else if(ts.isAway&&!up.awayFromHome){
            const up2={...up,awayFromHome:true};saveProfile(up2);st.profile=up2;
          }
        }
        const wd=await fetchWeatherAndUV(lat,lon);
        if(wd)updateWeatherUI(wd,geo);
        return;
      }catch(e){}
    }
    // Not stale — use saved coordinates for UV
    if(p.lat&&p.lon){
      try{const wd=await fetchWeatherAndUV(p.lat,p.lon);if(wd)updateWeatherUI(wd,{city:p.city});}catch(e){}
      return;
    }
  }
  // Fallback 1: saved lat/lon from profile
  if(p.lat&&p.lon){
    try{const wd=await fetchWeatherAndUV(p.lat,p.lon);if(wd)updateWeatherUI(wd,{city:p.city});}catch(e){}
    return;
  }
  // Fallback 2: postcode lookup via postcodes.io (free, keyless UK API)
  if(p.postcode){
    const coords=await fetchCoordinatesFromPostcode(p.postcode);
    if(coords){
      try{
        const wd=await fetchWeatherAndUV(coords.lat,coords.lon);
        if(wd){updateWeatherUI(wd,{city:`Based on your current postcode (${p.postcode.toUpperCase()})`});return;}
      }catch(e){}
    }
    showPostcodeUVError(p);
  }
}

    consentData:st.consentData,consentMarketing:st.consentMarketing,
    consentLocation:st.consentLocation,consentTravel:st.consentTravel,

    riskScore:st.riskScore,riskLevel:st.riskLevel,

    homeCountry:st.country_code||(st.postcode?'gb':''),locationTimestamp:st.lat?Date.now():null,

}

function startLoadingMessages(){
  const msgs=['Analysing your risk profile…','Comparing against UK skin cancer risk data…','Identifying your key risk factors…','Calculating personalised UV adjustments…','Preparing your Skin Safety Dashboard…'];
  let i=0;const msgEl=document.getElementById('loadingMsg');
  const iv=setInterval(()=>{
    i++;if(i<msgs.length&&msgEl){msgEl.style.animation='none';msgEl.offsetHeight;msgEl.style.animation='fadeIn .4s ease-out';msgEl.textContent=msgs[i];}

function showPostcodeUVError(p){
  const loadEl=document.getElementById('hp-uv-loading'),dataEl=document.getElementById('hp-uv-data');
  if(loadEl)loadEl.style.display='none';
  if(dataEl){dataEl.style.display='block';dataEl.innerHTML=`<div class="uv-unavailable"><div class="uv-unavailable-icon">&#9888;&#65039;</div><div style="font-size:14px;font-weight:600;color:var(--tmc-navy)">UV data unavailable</div><div style="margin-top:4px;font-size:12px">Enable location or check postcodes.io is available.</div><button class="btn-secondary" style="margin-top:12px;font-size:13px;padding:10px" onclick="retryPostcodeUV()">Retry &#8634;</button></div><div class="uv-spf-rec" style="margin-top:12px">${getDefaultSPFRec(p.skinType)}</div>`;}

async function retryPostcodeUV(){
  const p=st.profile;if(!p||!p.postcode)return;
  const loadEl=document.getElementById('hp-uv-loading'),dataEl=document.getElementById('hp-uv-data');
  if(loadEl){loadEl.style.display='block';loadEl.className='uv-loading-state';loadEl.innerHTML=`<div class="uv-loading-spinner"></div><div style="font-size:13px;color:var(--tmc-gray-400)">Retrying…</div><div class="uv-spf-rec" style="margin-top:12px">${getDefaultSPFRec(p.skinType)}</div>`;}
  if(dataEl)dataEl.style.display='none';
  const coords=await fetchCoordinatesFromPostcode(p.postcode);
  if(coords){try{const wd=await fetchWeatherAndUV(coords.lat,coords.lon);if(wd){updateWeatherUI(wd,{city:`Based on your current postcode (${p.postcode.toUpperCase()})`});return;}}catch(e){}}
  showPostcodeUVError(p);
}
function resetProfile(){if(confirm('This will clear your profile and restart the questionnaire. Are you sure?')){clearProfile();st.profile=null;st.screen='welcome';st.history=['welcome'];st.weatherData=null;st.currentCity='';render();}}

// ===== MAIN RENDER =====
function render(){
  const app=document.getElementById('app');
  const dirClass=st.navDirection==='back'?'screen-slide-left':'screen-slide-right';
  let html='';
  switch(st.screen){
    case 'welcome':html=renderWelcome();break;case 'email':html=renderEmail();break;
    case 'consent':html=renderConsent();break;case 'skintype':html=renderSkinType();break;
    case 'questionnaire':html=renderQuestionnaire();break;case 'bodymapselect':html=renderBodyMapSelect();break;
    case 'phototips':html=renderPhotoTips();break;case 'fullbodycapture':html=renderFullBodyCapture();break;
    case 'fullbodysummary':html=renderFullBodySummary();break;case 'bodymap':html=renderBodyMap();break;
    case 'photoUpload':html=renderPhotoUpload();break;case 'abcde':html=renderABCDE();break;
    case 'consent_location':html=renderConsentLocation();break;case 'consent_travel':html=renderConsentTravel();break;
    case 'consent_notifications':html=renderConsentNotifications();break;
    case 'loading':html=renderLoading();break;case 'homepage':html=renderHomepage();break;
    default:html=renderWelcome();
  }
  app.innerHTML=`<div class="${dirClass}">${html}</div>`;
  bindEvents();
  if(st.screen==='loading')startLoadingMessages();
  if(st.screen==='homepage')setTimeout(()=>{animateRiskGaugeIfOpen();initHomepageAsync();},100);
}
// ===== EVENT BINDING =====
function bindEvents(){
  // Email
  const nameIn=document.getElementById('nameInput'),emailIn=document.getElementById('emailInput'),postIn=document.getElementById('postcodeInput'),emailNext=document.getElementById('emailNext');
  if(nameIn&&emailIn&&postIn&&emailNext){
    const chk=()=>{st.name=nameIn.value.trim();st.email=emailIn.value.trim();st.postcode=postIn.value.trim();emailNext.disabled=!(st.name&&st.email.includes('@')&&st.email.includes('.')&&st.postcode.length>=2);};
    nameIn.addEventListener('input',chk);emailIn.addEventListener('input',chk);postIn.addEventListener('input',chk);
    emailNext.addEventListener('click',()=>navigate('consent'));chk();
  }
  // Consent
  const consentDataEl=document.getElementById('consentData'),consentMktEl=document.getElementById('consentMarketing'),consentNext=document.getElementById('consentNext');
  if(consentDataEl)consentDataEl.addEventListener('click',()=>{st.consentData=!st.consentData;render();});
  if(consentMktEl)consentMktEl.addEventListener('click',()=>{st.consentMarketing=!st.consentMarketing;render();});
  if(consentNext)consentNext.addEventListener('click',()=>navigate('skintype'));
  // Skin type
  document.querySelectorAll('.skin-type-card').forEach(c=>c.addEventListener('click',()=>{st.skinType=parseInt(c.dataset.skin);render();}));
  const skinNext=document.getElementById('skinNext');
  if(skinNext)skinNext.addEventListener('click',()=>{st.currentQuestion=0;navigate('questionnaire');});
  // Questionnaire
  document.querySelectorAll('.option-card[data-answer]').forEach(c=>c.addEventListener('click',()=>{st.answers[questions[st.currentQuestion].id]=c.dataset.answer;render();}));
  const questionNext=document.getElementById('questionNext');
  if(questionNext)questionNext.addEventListener('click',()=>{if(st.currentQuestion<questions.length-1){st.currentQuestion++;render();}else navigate('bodymapselect');});
  // Photo mode
  document.querySelectorAll('.photomode-card[data-mode]').forEach(c=>c.addEventListener('click',()=>{st.photoMode=c.dataset.mode;navigate('phototips');}));
  const tipsBtn=document.getElementById('tipsGotIt');
  if(tipsBtn)tipsBtn.addEventListener('click',()=>{if(st.photoMode==='fullbody'){st.fullBodyStep=0;navigate('fullbodycapture');}else navigate('bodymap');});
  // Full body capture
  const captShoot=document.getElementById('captureShoot'),photoInFull=document.getElementById('photoInputFull');
  if(captShoot&&photoInFull){captShoot.addEventListener('click',()=>photoInFull.click());photoInFull.addEventListener('change',e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=ev=>{st.fullBodyPhotos[st.fullBodyStep]=ev.target.result;render();};r.readAsDataURL(f);}});}
  const captNext=document.getElementById('captureNext');
  if(captNext)captNext.addEventListener('click',()=>{if(st.fullBodyStep<fullBodySteps.length-1){st.fullBodyStep++;render();}else navigate('fullbodysummary');});
  const captRetake=document.getElementById('captureRetake');
  if(captRetake)captRetake.addEventListener('click',()=>{st.fullBodyPhotos[st.fullBodyStep]=null;render();});
  const captSkip=document.getElementById('captureSkip');
  if(captSkip)captSkip.addEventListener('click',()=>{if(st.fullBodyStep<fullBodySteps.length-1){st.fullBodyStep++;render();}else navigate('fullbodysummary');});
  document.querySelectorAll('[data-retake]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();const idx=parseInt(el.dataset.retake);st.fullBodyPhotos[idx]=null;st.fullBodyStep=idx;navigate('fullbodycapture');}));
  // Body map
  document.querySelectorAll('.body-region-area[data-region]').forEach(el=>el.addEventListener('click',()=>{st.selectedRegion=el.dataset.region;navigate('photoUpload');}));
  const bodyMapNext=document.getElementById('bodyMapNext');if(bodyMapNext)bodyMapNext.addEventListener('click',()=>navigate('abcde'));
  const photoZone=document.getElementById('photoZone'),photoIn=document.getElementById('photoInput');
  if(photoZone&&photoIn){photoZone.addEventListener('click',()=>photoIn.click());photoIn.addEventListener('change',e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=ev=>{st.bodyPhotos[st.selectedRegion]=ev.target.result;render();};r.readAsDataURL(f);}});}
  // ABCDE
  document.querySelectorAll('[data-abcde]').forEach(c=>c.addEventListener('click',()=>{st.abcdeAnswers[c.dataset.abcde]=!st.abcdeAnswers[c.dataset.abcde];render();}));
  // Location consent toggle
  const locToggle=document.getElementById('locationToggle');
  if(locToggle){
    locToggle.addEventListener('change',async()=>{
      if(locToggle.checked){
        try{
          const pos=await getCurrentPosition();
          st.consentLocation=true;st.lat=pos.coords.latitude;st.lon=pos.coords.longitude;
          const geo=await reverseGeocode(st.lat,st.lon);st.city=geo.city;st.country=geo.country;st.country_code=geo.country_code;
          render();
        }catch(e){locToggle.checked=false;st.consentLocation=false;showToast('Location permission denied');}
      }else{st.consentLocation=false;st.lat=null;st.lon=null;render();}
    });
  }
  // Travel consent toggle
  const travToggle=document.getElementById('travelToggle');
  if(travToggle)travToggle.addEventListener('change',()=>{st.consentTravel=travToggle.checked;});
}
// ===== DEV TOOLS =====
function devSimulateHolidayReturn(){
  const p=st.profile;if(!p)return;
  const now=Date.now();
  let h=getLocationHistory();
  for(let i=0;i<5;i++)h.push({lat:41.385064,lon:2.173403,country:'Spain',country_code:'es',timestamp:now-(6-i)*24*60*60*1000});
  h.push({lat:51.46,lon:-0.306,country:'United Kingdom',country_code:'gb',timestamp:now});
  if(h.length>90)h=h.slice(-90);
  saveLocationHistory(h);
  const up={...p,awayFromHome:true,homeCountry:p.homeCountry||'gb'};
  saveProfile(up);st.profile=up;
  const ts=checkTravelStatus(up);
  if(ts.justReturned&&shouldShowTravelBanner()){
    const up2={...up,awayFromHome:false};saveProfile(up2);st.profile=up2;
    st.showTravelBanner=true;render();
  }else{
    showToast('Travel state: away='+ts.isAway+', returned='+ts.justReturned);
  }
}
function devResetTravel(){
  localStorage.removeItem('tmcLocationHistory');
  localStorage.removeItem('tmcTravelBannerDismissed');
  const p=st.profile;
  if(p){const up={...p,awayFromHome:false};saveProfile(up);st.profile=up;}
  st.showTravelBanner=false;
  const b=document.querySelector('.travel-banner');if(b)b.remove();
  showToast('Travel data reset');
}
// ===== INIT =====
function init(){
  const p=getProfile();
  if(p&&p.version==='0.2'){
    st.profile=p;st.screen='homepage';st.history=['homepage'];
    // Check travel banner
    if(p.awayFromHome&&shouldShowTravelBanner())st.showTravelBanner=true;
    render();
  }else{
    render();
  }
}
init();
</script>
